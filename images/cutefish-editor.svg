<?xml version="1.0" encoding="UTF-8"?>
<!-- Cutefish Text Editor 应用图标
     风格：CutefishUI 官方应用图标语言 —— 大圆角方形 + 品牌蓝渐变 + 白色简洁符号
     元素：白色文档卡片（含蓝色代码行，暗示语法高亮）+ 右下角白色编辑笔（"编辑器"语义） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0.85" y1="0.15" x2="0.15" y2="0.85">
      <stop offset="0" stop-color="#66b2ff"/>
      <stop offset="1" stop-color="#3a6fd0"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景（CutefishUI 大圆角方形） -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg)"/>

  <!-- 白色文档卡片（右上角折角） -->
  <path d="M32 24 h42 l14 14 v54 q0 6 -6 6 H32 q-6 0 -6 -6 V30 q0 -6 6 -6 z" fill="#ffffff"/>
  <path d="M74 24 l14 14 h-14 z" fill="#c8ddf5"/>

  <!-- 文字线（蓝色代码行，突出语法高亮能力） -->
  <g stroke="#3a6fd0" stroke-width="6" stroke-linecap="round">
    <line x1="38" y1="50" x2="80" y2="50"/>
    <line x1="38" y1="66" x2="66" y2="66"/>
    <line x1="38" y1="82" x2="56" y2="82"/>
  </g>

  <!-- 右下角编辑笔（白色，突出"编辑器"） -->
  <path d="M56 104 L98 66 L106 74 L64 112 Z" fill="#ffffff"/>
  <path d="M98 66 L106 74 L102 78 L94 70 Z" fill="#9dc6ff"/>
  <line x1="98" y1="66" x2="106" y2="74" stroke="#3a6fd0" stroke-width="2.5" stroke-linecap="round"/>
</svg>
